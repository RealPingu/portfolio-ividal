server {
    # listen to the 80 port
    listen 80;
    # wildcard to catch all domains
    server_name _;
    # root, looks on where the dockerfile copies out/ folder
    root /usr/share/nginx/html;
    # default file to serve
    index index.html;

    #Gzip, compress files before sending, decreasing load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;                

    #Next.js static
    location /{
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # cache files for 1 year to save disk
    #static chunks
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    
    # cache images, fonts, favicons, 30 days
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
