<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background matching About and Project cards -->
  <rect width="100%" height="100%" fill="#eee1c5"/>

  <g transform="translate(200, 150)">
    <!-- Central Medical Cross (Exact Ocean Blue/Green #006d76 from original image) -->
    <path d="M -18 -55 L 18 -55 L 18 -18 L 55 -18 L 55 18 L 18 18 L 18 55 L -18 55 L -18 18 L -55 18 L -55 -18 L -18 -18 Z" 
          fill="#006d76" 
          stroke="#2e282a" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Left Soundwave Bars (Acoustic audio bars in solid black) -->
    <!-- Group 1 (Leftmost) -->
    <line x1="-155" y1="-8" x2="-155" y2="8" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-147" y1="-18" x2="-147" y2="18" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-139" y1="-32" x2="-139" y2="32" stroke="#2e282a" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="-131" y1="-24" x2="-131" y2="24" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-123" y1="-14" x2="-123" y2="14" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-115" y1="-6" x2="-115" y2="6" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>

    <!-- Group 2 (Near Cross) -->
    <line x1="-100" y1="-12" x2="-100" y2="12" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-92" y1="-26" x2="-92" y2="26" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-84" y1="-38" x2="-84" y2="38" stroke="#2e282a" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="-76" y1="-28" x2="-76" y2="28" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-68" y1="-15" x2="-68" y2="15" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Soundwave Bars -->
    <!-- Group 1 (Near Cross) -->
    <line x1="68" y1="-15" x2="68" y2="15" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="-28" x2="76" y2="28" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="-38" x2="84" y2="38" stroke="#2e282a" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="92" y1="-26" x2="92" y2="26" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="-12" x2="100" y2="12" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>

    <!-- Group 2 (Rightmost) -->
    <line x1="115" y1="-6" x2="115" y2="6" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="123" y1="-14" x2="123" y2="14" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="131" y1="-24" x2="131" y2="24" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="139" y1="-32" x2="139" y2="32" stroke="#2e282a" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="147" y1="-18" x2="147" y2="18" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="-8" x2="155" y2="8" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
