<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background matching About and Project cards -->
  <rect width="100%" height="100%" fill="#efe1c8"/>

  <defs>
    <!-- Gradient for Next.js diagonal stroke -->
    <linearGradient id="nextDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. TOP VERTEX: Next.js Official Logo -->
