    <!-- Outer Black Circle with retro contour -->
    <circle cx="0" cy="0" r="36" fill="#000000" stroke="#2e282a" stroke-width="2.5"/>
    
    <!-- Stylized Next.js 'N' -->
    <g transform="scale(0.44) translate(-96, -90)">
