<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background matching About cards exactly -->
  <rect width="100%" height="100%" fill="#efe1c8"/>

  <!-- Top: Minimalist Drone (Hovering) -->
  <g transform="translate(200, 75)">
    <!-- Central Pod Body -->
    <path d="M -18 0 C -18 -8 18 -8 18 0 C 18 8 -18 8 -18 0 Z" fill="#efe1c8" stroke="#2e282a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Camera Eye / Sensor -->
    <circle cx="0" cy="5" r="2.5" fill="#2e282a"/>

    <!-- Drone Rotor Arms -->
    <path d="M -16 -2 L -45 -12" stroke="#2e282a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 16 -2 L 45 -12" stroke="#2e282a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -14 3 L -38 12" stroke="#2e282a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 3 L 38 12" stroke="#2e282a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rotor Motors & Propeller Blades -->
    <!-- Top Left -->
    <circle cx="-45" cy="-12" r="2" fill="#2e282a"/>
    <ellipse cx="-45" cy="-14" rx="14" ry="2.5" fill="none" stroke="#2e282a" stroke-width="2" stroke-linecap="round"/>
    <!-- Top Right -->
    <circle cx="45" cy="-12" r="2" fill="#2e282a"/>
    <ellipse cx="45" cy="-14" rx="14" ry="2.5" fill="none" stroke="#2e282a" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom Left -->
    <circle cx="-38" cy="12" r="2" fill="#2e282a"/>
    <ellipse cx="-38" cy="10" rx="13" ry="2.5" fill="none" stroke="#2e282a" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom Right -->
    <circle cx="38" cy="12" r="2" fill="#2e282a"/>
    <ellipse cx="38" cy="10" rx="13" ry="2.5" fill="none" stroke="#2e282a" stroke-width="2" stroke-linecap="round"/>

    <!-- Landing Skids -->
    <path d="M -10 7 L -14 18 L -20 18" fill="none" stroke="#2e282a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 10 7 L 14 18 L 20 18" fill="none" stroke="#2e282a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Suspended Parcel / Payload Box -->
    <line x1="0" y1="8" x2="0" y2="18" stroke="#2e282a" stroke-width="1.8" stroke-dasharray="2,2"/>
    <rect x="-8" y="18" width="16" height="15" rx="1.5" fill="#efe1c8" stroke="#2e282a" stroke-width="2"/>
    <line x1="-8" y1="24" x2="8" y2="24" stroke="#2e282a" stroke-width="1.5"/>
    <line x1="0" y1="18" x2="0" y2="33" stroke="#2e282a" stroke-width="1.5"/>
  </g>

  <!-- Bottom: Minimalist Delivery Truck -->
  <g transform="translate(200, 205)">
    <!-- Ground Baseline -->
    <line x1="-105" y1="42" x2="105" y2="42" stroke="#2e282a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Main Cargo Box (Completely blank, clean lines) -->
    <rect x="-85" y="-38" width="95" height="65" rx="3" fill="#efe1c8" stroke="#2e282a" stroke-width="2.8" stroke-linejoin="round"/>
    
    <!-- Truck Cab -->
    <path d="M 10 27 L 10 -15 L 35 -15 L 56 3 L 64 3 L 64 27 Z" fill="#efe1c8" stroke="#2e282a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Windshield / Window -->
    <path d="M 18 -9 L 32 -9 L 48 3 L 18 3 Z" fill="none" stroke="#2e282a" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Headlight & Bumper -->
    <rect x="64" y="12" width="4" height="7" rx="1" fill="#2e282a"/>
    <path d="M 58 27 L 69 27" stroke="#2e282a" stroke-width="3" stroke-linecap="round"/>

    <!-- Door Handle -->
    <line x1="22" y1="10" x2="28" y2="10" stroke="#2e282a" stroke-width="2" stroke-linecap="round"/>

    <!-- Rear Wheel -->
    <circle cx="-52" cy="30" r="14" fill="#efe1c8" stroke="#2e282a" stroke-width="2.8"/>
    <circle cx="-52" cy="30" r="5" fill="#2e282a"/>

    <!-- Front Wheel -->
    <circle cx="40" cy="30" r="14" fill="#efe1c8" stroke="#2e282a" stroke-width="2.8"/>
    <circle cx="40" cy="30" r="5" fill="#2e282a"/>
  </g>
</svg>
